# =========================
# CI Pipeline
# =========================
kind: pipeline
type: kubernetes
name: ci

trigger:
  event: [push, pull_request]
  branch: [main]

node_selector:
  node-role: drone
tolerations:
  - key: dedicated
    value: drone
    effect: NoSchedule

steps:
  # イメージを push する先がまだないので、ビルドが通ることだけを確認する。
  # シークレットは参照しない。
  - name: build
    image: gcr.io/kaniko-project/executor:debug
    commands:
      - |
        /kaniko/executor \
          --context=dir:///drone/src \
          --dockerfile=/drone/src/Dockerfile \
          --no-push
